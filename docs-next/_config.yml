title: Primo — draft documentation
author: Primo contributors
logo: _static/primo-logo.svg

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/primo-solver/primo
  branch: main
  path_to_book: docs-next

html:
  use_repository_button: true
  use_issues_button: false
  use_edit_page_button: false

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - fieldlist
    - substitution
    - tasklist

sphinx:
  extra_extensions:
    - sphinx.ext.extlinks
  recursive_update: true
  config:
    extlinks:
      source:
        - "https://github.com/primo-solver/primo/blob/e6d9fcb06f476375aded43a13c22a6d6b4939144/%s"
        - "%s"
    myst_heading_anchors: 3
    html_show_copyright: false
    html_show_sourcelink: false
    html_theme_options:
      announcement: "Draft rewrite — pages await review. The existing book remains in docs/."
      use_download_button: false
      logo:
        image_light: _static/primo-logo.svg
        image_dark: _static/primo-logo-dark.svg
        alt_text: Primo
