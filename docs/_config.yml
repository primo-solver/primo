title: Primo Solver Notes
author: Primo contributors
logo: ""

execute:
  execute_notebooks: "off"

repository:
  path_to_book: docs

html:
  use_repository_button: false
  use_issues_button: false
  use_edit_page_button: false

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - fieldlist
    - linkify
    - substitution
    - tasklist

sphinx:
  config:
    # Generate implicit targets for headings down to level 3, so that an
    # ordinary `[text](#some-heading)` link resolves as a MyST reference
    # instead of warning and falling back to a bare HTML anchor.
    myst_heading_anchors: 3
    html_show_copyright: false
    html_show_sourcelink: false
    html_theme_options:
      use_download_button: false
    suppress_warnings:
      - myst.header
